  <template id="bio-jorge"><p>Je suis Jorge Alexandre, fondateur de Alexandre Premium. Je coiffe à votre domicile. Je suis diplômé d'une prestigieuse école de coiffure de Paris et formé chez le regretté président de la haute coiffure française Robert Guéry.</p><p>Riche de plus de 25 ans d'expérience dans le métier de la coiffure, j'ai voulu élargir mon activité au profit de la beauté, qui est ma grande passion. J'ai créé ce site haut de gamme où je collabore avec des professionnels auxquels je fais confiance depuis toujours.</p><p>Je m'engage à ce que le jour J soit parfait. Si vous préférez bénéficier de nos soins en salon, je collabore également avec de grands salons de coiffure et centres d'esthétique.</p></template>
  <template id="bio-valerie"><p>Je suis Valérie, formée à la coiffure historique : je crée des coiffures et des chignons de mariées ou pour des événements, avec si nécessaire des postiches en cheveux naturels.</p><p>Maquilleuse studio diplômée de l'atelier du Griffon Paris, je réalise des make-up type cinéma et studio photo. À l'écoute de vos souhaits, je m'adapte à votre morphologie et votre carnation pour un maquillage sur mesure — et des coiffures de la plus sophistiquée à la plus bohème.</p></template>
  <template id="bio-marie"><p>Je suis Marie, conseillère en image avec plus de 20 ans d'expérience dans l'univers de la beauté et du bien-être, diplômée de l'institut « Image Nouvelle » en 2016, aux côtés de Caroline Baly (France 2, « Comment ça va bien »).</p><p>Que vous soyez à la recherche d'un véritable relooking ou que vous ayez juste besoin de conseils, je suis là pour vous accompagner et vous aider à vous révéler, tout en restant vous-même.</p></template>
  <template id="bio-mickael"><p>Je m'appelle Mickael, titulaire d'un BPJEPS des métiers de la forme (coach sportif), complété par une formation deep tissue et massages relaxants à la Maison du Lotus.</p></template>
  <template id="bio-cristiane"><p>Je suis Cristiane, formée à l'Académie Make Up For Ever, dans la spécialité « rencontrer les mariées et la mère des mariées ». Coiffeuse et maquilleuse, je travaille avec les meilleurs produits professionnels du marché.</p><p>En coiffure, je suis spécialisée dans la coiffure de mariées et événementielle, pour que votre look soit parfait, peu importe vos envies.</p></template>
  <template id="bio-carine"><p>Je suis Carine, toujours de bonne humeur et joviale : je transmets ce dynamisme à mes client(e)s depuis une vingtaine d'années. Diplômée d'une école de coiffure de Paris.</p><p>Je suis spécialisée dans la coiffure de mariées et événementielle, mais aussi le soin capillaire et la coloration. L'écoute et les conseils basés sur mon expérience sont primordiaux pour une satisfaction commune.</p></template>
  <template id="bio-sandrine"><p>Je suis Sandrine, coiffeuse en Coupe Énergétique. Forte de 40 ans d'expérience dans la coiffure, dont 25 ans à domicile, je mets mon savoir-faire au service d'un soin capillaire unique et profond.</p><p>Issue de la médecine traditionnelle chinoise, la coupe énergétique agit sur les méridiens du cuir chevelu et la circulation de l'énergie vitale : elle libère les tensions, réharmonise le corps et l'esprit, et redonne vitalité, brillance et légèreté. Je vous reçois chez moi, dans une ambiance calme et bienveillante — ou chez vous.</p></template>
  <template id="bio-kacim"><p>Coach sportif certifié (Master STAPS, BPJEPS, Préparation physique), je vous accompagne avec une méthode fondée sur l'écoute, la science et la qualité du mouvement.</p><p>Ma devise : « Less pain, more gain ». Chaque séance est personnalisée, efficace et sans frustration, pour des résultats durables, un corps fort et un mental au top.</p></template>
  <template id="bio-pascal"><p>Fort de 30 années d'expérience, je mets mon expertise et ma sensibilité artistique au service de vos projets, pour des images authentiques, élégantes et impactantes.</p><p>Événementiel, entreprise (portraits, reportages corporate), immobilier et mariage : reportage complet, discret et naturel pour capturer chaque émotion. Disponible en France et à l'international.</p></template>
